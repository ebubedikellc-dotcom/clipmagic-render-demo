<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create ClipMagic account</title><style>
:root{--bg:#07111f;--panel:#0d1a2b;--line:#263a55;--text:#f5f8ff;--muted:#91a4bf;--cyan:#2cb4f3}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 75% 0,rgba(44,180,243,.16),transparent 35%),var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--text);padding:20px}.box{width:min(460px,100%);padding:28px;border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:0 25px 60px rgba(0,0,0,.35)}.brand{font-weight:900;letter-spacing:.1em}.brand span{color:var(--cyan)}h1{font-size:2rem;margin:26px 0 8px}p{color:var(--muted);line-height:1.5}label{display:block;font-weight:800;margin:17px 0 7px}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:#071321;color:white;font:inherit}button{width:100%;border:0;border-radius:13px;padding:14px;margin-top:20px;background:var(--cyan);font-weight:900;font-size:1rem}.message{padding:12px;border-radius:11px;background:#48202b;color:#ffdbe1;margin:16px 0}a{color:#70d2ff}.bottom{text-align:center;margin-bottom:0}
</style></head><body><main class="box"><div class="brand">CLIP<span>MAGIC</span> AI</div><h1>Create your account</h1><p>Use only your email and a private password.</p>{{MESSAGE}}<form method="post" action="/register"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required><button type="submit">Create account</button></form><p class="bottom">Already registered? <a href="/login">Log in</a></p></main></body></html>
