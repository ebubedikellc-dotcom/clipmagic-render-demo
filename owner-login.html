<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>ClipMagic Owner Login</title>
  <style>
    :root{--bg:#07111f;--line:#263a56;--text:#f5f8ff;--muted:#91a4bf;--cyan:#2cb4f3}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 70% 0,rgba(44,180,243,.16),transparent 36%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.card{width:min(440px,100%);background:linear-gradient(145deg,#102039,#091524);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 25px 65px rgba(0,0,0,.35)}.mark{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,var(--cyan),#0875d1);display:grid;place-items:center;margin-bottom:22px}.mark:before{content:"";border-left:17px solid white;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:5px}h1{margin:0 0 8px;font-size:2rem}p{color:var(--muted);line-height:1.5;margin:0 0 22px}.error{color:#ffd9de;background:rgba(255,107,125,.12);border:1px solid rgba(255,107,125,.35);padding:11px 13px;border-radius:12px;margin-bottom:16px}label{display:block;font-weight:800;font-size:.82rem;margin:14px 0 7px;text-transform:uppercase;letter-spacing:.06em}input{width:100%;min-height:50px;border:1px solid var(--line);border-radius:12px;background:#071321;color:var(--text);padding:12px 14px;font:inherit}button{width:100%;min-height:52px;margin-top:20px;border:0;border-radius:13px;background:var(--cyan);color:#06121f;font-weight:900;font-size:1rem;cursor:pointer}.back{display:block;text-align:center;color:#a9dbf5;margin-top:18px;text-decoration:none}
  </style>
</head>
<body><main class="card"><div class="mark"></div><h1>Owner login</h1><p>Enter the registered ClipMagic owner email to open the private control panel. No password is required.</p>{{MESSAGE}}<form method="post" action="/owner-login"><label for="email">Owner email</label><input id="email" name="email" type="email" autocomplete="email" value="Ebubedikellc@gmail.com" required><button type="submit">Open control panel</button></form><a class="back" href="/">Back to ClipMagic</a></main></body>
</html>
