services:
  - type: web
    name: clipmagic-demo
    runtime: static
    rootDir: .
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
  - type: web
    name: clipmagic-engine
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CLIPMAGIC_JOB_TTL_SECONDS
        value: "3600"
      - key: CLIPMAGIC_MAX_UPLOAD_MB
        value: "250"
      - key: CLIPMAGIC_OWNER_EMAIL
        value: Ebubedikellc@gmail.com
